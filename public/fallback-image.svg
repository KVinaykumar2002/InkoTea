<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice" role="img" aria-label="INKOTEA placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A2B12"/>
      <stop offset="0.55" stop-color="#6B3F1B"/>
      <stop offset="1" stop-color="#8E5A2E"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#E6C19A" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#dots)"/>
  <rect width="1200" height="750" fill="url(#vignette)"/>

  <!-- steaming cup glyph, centered -->
  <g transform="translate(600 320)" fill="none" stroke="#E6C19A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- steam -->
    <path d="M-44 -118 q-14 -22 0 -44 q14 -22 0 -44" stroke-opacity="0.55"/>
    <path d="M0 -118 q-14 -22 0 -44 q14 -22 0 -44" stroke-opacity="0.7"/>
    <path d="M44 -118 q-14 -22 0 -44 q14 -22 0 -44" stroke-opacity="0.55"/>
    <!-- cup body -->
    <path d="M-78 -88 h156 v44 a78 78 0 0 1 -78 78 a78 78 0 0 1 -78 -78 z" fill="#E6C19A" fill-opacity="0.12"/>
    <!-- handle -->
    <path d="M78 -68 q44 0 44 36 q0 36 -44 36"/>
    <!-- saucer -->
    <ellipse cx="0" cy="50" rx="118" ry="14" fill="#E6C19A" fill-opacity="0.18"/>
  </g>

  <text x="600" y="500" text-anchor="middle"
        font-family="'Playfair Display', serif"
        font-size="68" font-weight="700" letter-spacing="14" fill="#F5EFE5" opacity="0.95">
    INKOTEA
  </text>
  <text x="600" y="544" text-anchor="middle"
        font-family="Calibri, Segoe UI, sans-serif"
        font-size="18" font-weight="500" letter-spacing="6" fill="#E6C19A" opacity="0.85">
    THE FEELING OF ONE MORE
  </text>
</svg>
